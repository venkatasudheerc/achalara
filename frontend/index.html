<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achalara — Performance Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // The theme before first paint, so nobody sees a flash of the wrong one.
      // Mirrors ThemeContext: the new app (/home) and the sign-in pages honour
      // the viewer's choice (light, dark, or the device's own); the older
      // screens stay dark for everyone.
      (function () {
        var root = document.documentElement
        var p = location.pathname
        var oneApp = /^\/(home|portal|login|invite|reset|request-invitation)(\/|$)/.test(p)
        var dark = true
        if (oneApp) {
          root.classList.add('one-app')
          var t = null
          try { t = localStorage.getItem('achalara-theme') } catch (e) {}
          dark = t === 'dark' || ((t !== 'light') && matchMedia('(prefers-color-scheme: dark)').matches)
        }
        if (dark) root.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
