          description: The preview as written, what was added, and the holdings check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "403":
          description: A client user; this door is the advisor's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The account is not set up to take files yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not an Excel or CSV file
          content:
            application/json:
              schema:
