  # ─── Admin ──────────────────────────────────────────────────────────────────

  /api/v1/admin/import-historical:
    post:
      tags: [admin]
      summary: Import historical trades from a CSV file
      description: |
        CSV columns: Date, Symbol, Action, Quantity, Price, Commission, Strategy, Account, Notes.

        **Routing modes:**
        - `sleeve_id` provided → all rows go into that single sleeve
        - `sleeve_id` omitted → auto-route by Account + Strategy columns (creates accounts/strategies/sleeves as needed)

        **Operation modes:**
        - `VALIDATE` → dry-run; returns warnings without writing to DB
        - `IMPORT` → writes trades; skips duplicates
      operationId: importHistorical
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          description: Target client UUID
        - name: sleeve_id
          in: query
          required: false
          schema:
            type: string
          description: Target sleeve UUID (omit to enable auto-routing)
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [VALIDATE, IMPORT]
          description: VALIDATE for dry-run, IMPORT to persist
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to import
      responses:
        "200":
          description: Import result (or validation result in VALIDATE mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/sync-daily:
    post:
      tags: [admin]
      summary: Sync trades from a Google Sheet into a sleeve
      description: Fetches the public Google Sheet as CSV and imports new rows. Duplicate rows are skipped via `google_sheet_row_id`.
      operationId: syncDaily
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: sleeve_id
          in: query
          required: true
          schema:
            type: string
        - name: sheet_id
          in: query
          required: true
          schema:
            type: string
          description: Google Sheets document ID
        - name: range_name
          in: query
          required: false
          schema:
            type: string
            default: Sheet1
          description: Sheet tab / named range
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDailyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

