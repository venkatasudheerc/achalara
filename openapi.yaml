        - excess_return_pct
        - unpriced_pct
        - is_provisional
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        opening_value:
          type: number
        closing_value:
          type: number
        cash_value:
          type: number
          nullable: true
        net_flow:
          type: number
          description: Money put in less money taken out during the period
        gain:
          type: number
          description: closing_value − opening_value − net_flow
        twr_pct:
          type: number
          nullable: true
          description: Time-weighted return for the period, as a decimal (0.05 = 5%); null when no capital was at work
        mwr_pct:
          type: number
          nullable: true
          description: Money-weighted return for the period, as a decimal
        twr_cumulative_pct:
          type: number
          nullable: true
          description: Time-weighted return from the start of the record to the period's end
        twr_ytd_pct:
          type: number
          nullable: true
        benchmark_return_pct:
          type: number
          nullable: true
        excess_return_pct:
          type: number
          nullable: true
        unpriced_pct:
          type: number
          description: Share of securities value held at last traded price for want of a daily close
        basis:
          type: string
          enum: [observed, reconstructed, mixed]
          description: Whether the period's days were captured from the brokerage, rebuilt from trades and prices, or both
        is_provisional:
          type: boolean
          description: True while the brokerage's transactions for some day in the period may still be arriving

    PeriodsResponse:
      type: object
      required: [level, id, grain, periods, name, benchmark, basis]
