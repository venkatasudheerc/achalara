          type: integer
        month:
          type: integer
        month_label:
          type: string
        start_value:
          type: number
        end_value:
          type: number
        cash_in:
          type: number
        cash_out:
          type: number
        net_cash_flow:
          type: number
        realized_gain:
          type: number
        return_pct:
          type: number
          nullable: true
          description: Monthly time-weighted return as a whole-number percentage (3.4 = 3.4%); null while no capital is at work
        includes_unrealized:
          type: boolean
          description: |
            True for the latest month only. No price history is stored, so open
            positions are carried at their last traded price and all unrealised
            gain to date is recognised in the latest month; earlier months
            reflect gains as they were realised.

    MonthlyReturnsResponse:
      type: object
