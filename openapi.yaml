# ─── Components ───────────────────────────────────────────────────────────────

  # ─── Client portal ──────────────────────────────────────────────────────────

  /api/v1/portal/connections:
    get:
      tags: [portal]
      summary: Where the viewer's figures come from
      description: >-
        The viewer's own Plaid logins, and, read-only (own false), the logins of others (a
        spouse's, a shared account's owner's) that feed an account in view. Each with its
        state, when it was last refreshed and checked, and the accounts in view it feeds with
        their health. Never an access key.
      operationId: portalConnections
      parameters:
        - {name: as_client, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The logins
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalConnectionsResponse'}
        '401': {description: Not signed in}
        '404': {description: (advisor) client not found}
  /api/v1/portal/accounts:
    get:
      tags:
      - portal
      summary: Portal Accounts
      description: Whose portal this is, the accounts in view, and each one's strategies.
      operationId: portal_accounts_api_v1_portal_accounts_get
      parameters:
      - name: as_client
        in: query
        required: false
        schema:
          description: 'Advisor only: the client whose portal to preview'
          type: string
          nullable: true
        description: 'Advisor only: the client whose portal to preview'
      - name: achalara_session
        in: cookie
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAccountsResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account not in view, or (advisor) client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid parameter, or an advisor did not name a client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/portal/accounts/{account_id}/imports/check:
    get:
      tags: [portal]
      summary: Whether the account's holdings agree with the custodian's record
      description: Compares every day the custodian recorded holdings with what the trades on file add up to, and says from which date a report should be downloaded to cover what is missing. Null before any record. Only for an account the client owns.
      operationId: portalHoldingsCheck
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: as_client
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: An advisor previewing this client
      responses:
        "200":
          description: The check, or null when the custodian has never recorded the account's holdings
          content:
            application/json:
              schema:
                nullable: true
                allOf: [{$ref: "#/components/schemas/ImportCheck"}]
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/portal/accounts/{account_id}/imports/preview:
    post:
      tags: [portal]
      summary: What a custodian's file would add to an account
      description: Reads the file and matches it against what is on file. Nothing is written. Only for an account the signed-in client owns; shared accounts are read-only.
      operationId: portalImportPreview
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: as_client
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: An advisor previewing this client, who may import as the client does
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The custodian's activity report (Vanguard, Excel or CSV) or Achalara's template (CSV)
      responses:
        "200":
          description: What the file holds and what of it is not on file yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The account is not set up to take files yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not an Excel or CSV file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The file cannot be read, or names another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/portal/accounts/{account_id}/imports:
    post:
      tags: [portal]
      summary: Add what a custodian's file holds that is not on file
      description: Reads the file again, adds only what is missing, rebuilds the account's history and checks its holdings against the custodian's last recorded ones. Only for an account the signed-in client owns; shared accounts are read-only.
      operationId: portalImport
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
        - name: as_client
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: An advisor previewing is refused (403)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The custodian's activity report (Vanguard, Excel or CSV) or Achalara's template (CSV)
      responses:
        "200":
          description: The preview as written, what was added, and the holdings check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "403":
          description: Not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The account is not set up to take files yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is larger than 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not an Excel or CSV file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The file cannot be read, or names another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

