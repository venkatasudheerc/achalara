      - month
    OverviewAccount:
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        number_last4:
          type: string
          nullable: true
        shared:
          type: boolean
        value:
          type: number
          nullable: true
        cash:
          type: number
          nullable: true
        twr_pct:
          type: number
          nullable: true
        gain:
          type: number
          nullable: true
        sleeves:
          items:
            $ref: '#/components/schemas/OverviewSleeve'
          type: array
      type: object
      required:
      - id
      - client_id
      - name
      - shared
      - sleeves
    OverviewSleeve:
      properties:
        sleeve_id:
          type: string
        strategy_id:
          type: string
        strategy_name:
          type: string
        value:
          type: number
          nullable: true
        twr_pct:
          type: number
          nullable: true
        gain:
          type: number
          nullable: true
      type: object
      required:
      - sleeve_id
