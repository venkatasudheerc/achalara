      summary: Register a Google Sheet → sleeve mapping for automated daily sync
      operationId: createSyncConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncConfigCreate"
      responses:
        "201":
          description: Sync config created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetSyncConfig"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [admin]
