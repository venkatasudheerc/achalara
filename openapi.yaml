      tags: [invitations]
      summary: Mark a request as contacted or dismissed, or put it back as new (advisor only)
      operationId: updateInvitationRequest
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, contacted, dismissed]
      responses:
        "200":
          description: The request as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/webhooks/snaptrade:
    post:
      tags: [connections]
      summary: SnapTrade webhook receiver
      security: []
      description: |
        Verifies the `Signature` header (HMAC-SHA256 keyed with the consumer key,
        over the event written with sorted keys and no spaces as SnapTrade
        documents, or over the body as sent) before anything is acted on. An
        event delivered twice (same `webhookId`) is answered `duplicate` and not
        acted on again. Called by SnapTrade, not by the frontend.
      operationId: snaptradeWebhook
      parameters:
        - name: Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          description: Missing or invalid signature

