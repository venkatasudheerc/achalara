      - strategy_name
    PortalAccount:
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        number_last4:
          type: string
          nullable: true
        shared:
          type: boolean
        sleeves:
          items:
            $ref: '#/components/schemas/PortalSleeve'
          type: array
          default: []
      type: object
      required:
      - id
      - client_id
      - name
      - shared
    PortalAccountsResponse:
      properties:
        viewer:
          $ref: '#/components/schemas/PortalViewerResponse'
        accounts:
          items:
            $ref: '#/components/schemas/PortalAccount'
          type: array
      type: object
      required:
      - viewer
      - accounts
    PortalClosedLot:
      properties:
        account_id:
          type: string
        account_name:
          type: string
        shared:
          type: boolean
        sleeve_id:
          type: string
        strategy_id:
          type: string
        strategy_name:
          type: string
        symbol:
          type: string
        security_type:
          type: string
        event:
          type: string
          nullable: true
        opened_at:
          type: string
          format: date
          nullable: true
        closed_at:
          type: string
          format: date
        days_held:
          type: integer
          nullable: true
        term:
          type: string
        quantity:
          type: number
          nullable: true
        multiplier:
          type: integer
          default: 1
        entry_price:
          type: number
          nullable: true
        exit_price:
          type: number
          nullable: true
        cost:
          type: number
          description: What the lot cost, including any earlier loss a wash sale carried into it.
        proceeds:
          type: number
        disallowed_loss:
          type: number
          default: 0
          description: The part of this lot's loss a wash sale disallowed and carried into the shares that replaced it.
        short_term_gain:
          type: number
          default: 0
        long_term_gain:
          type: number
          default: 0
        realized_gain:
          type: number
          description: Proceeds less cost, plus the disallowed loss — the gain a brokerage reports.
        realized_gain_pct:
          type: number
          nullable: true
        adjustments:
          type: array
          items:
            type: string
            enum: [wash, mark, unmarked, index_option, written_option]
      type: object
      required:
      - account_id
      - account_name
      - shared
      - sleeve_id
      - strategy_id
      - strategy_name
      - symbol
      - security_type
      - closed_at
      - term
      - realized_gain
    PortalMonth:
      properties:
        year:
          type: integer
        month:
          type: integer
        twr_pct:
          type: number
          nullable: true
        is_provisional:
          type: boolean
      type: object
      required:
      - year
      - month
      - is_provisional
    PortalHomeResponse:
      properties:
        as_of:
          type: string
          format: date
          nullable: true
        live_prices_at:
          type: string
          format: date-time
          nullable: true
        record_through:
          type: string
          format: date
          nullable: true
        is_provisional:
          type: boolean
        total_value:
          type: number
        day_change:
          type: number
          nullable: true
        day_change_pct:
          type: number
          nullable: true
        ytd_twr_pct:
          type: number
          nullable: true
        benchmark:
          type: string
        benchmark_ytd_pct:
          type: number
          nullable: true
        excess_ytd_pct:
          type: number
          nullable: true
        first_date:
          type: string
          format: date
          nullable: true
          description: When the record these figures are drawn from starts.
        since_start_twr_pct:
          type: number
          nullable: true
        max_drawdown_pct:
          type: number
          nullable: true
          description: The largest fall from a high over the whole record, as a negative fraction.
        allocation:
          items:
            $ref: '#/components/schemas/HomeAllocation'
          type: array
        cash_value:
          type: number
          nullable: true
        income_ytd:
          type: number
        realized_ytd:
          type: number
        realized_short_ytd:
          type: number
        realized_long_ytd:
          type: number
        added_ytd:
          type: number
          nullable: true
        holdings_count:
          type: integer
        top_holdings:
          items:
            $ref: '#/components/schemas/HomeHolding'
          type: array
        movers_up:
          items:
            $ref: '#/components/schemas/HomeHolding'
          type: array
        movers_down:
          items:
            $ref: '#/components/schemas/HomeHolding'
          type: array
        expiring_options:
          items:
            $ref: '#/components/schemas/ExpiringOption'
          type: array
        carried_losses:
          type: number
        turning_long_term:
          items:
            $ref: '#/components/schemas/TurningLongTerm'
          type: array
        concentrated:
          items:
            $ref: '#/components/schemas/HomeHolding'
          type: array
      type: object
      required:
      - is_provisional
      - total_value
      - benchmark
      - allocation
      - income_ytd
      - realized_ytd
      - realized_short_ytd
      - realized_long_ytd
      - holdings_count
      - top_holdings
      - expiring_options
      - carried_losses
      - turning_long_term
      - concentrated
      description: 'The home page. Value and the day''s change are at live prices; the
    
        year''s figures run through ``record_through``, the custodian''s last day.'
    HomeHolding:
      properties:
        symbol:
          type: string
        value:
          type: number
        day_change:
          type: number
          nullable: true
          description: Today's move in dollars.
        day_change_pct:
          type: number
          nullable: true
        share:
          type: number
          nullable: true
      type: object
      required:
      - symbol
      - value
    HomeAllocation:
      properties:
        kind:
          type: string
        value:
          type: number
        share:
          type: number
          nullable: true
      type: object
      required:
      - kind
      - value
    ExpiringOption:
      properties:
        symbol:
          type: string
        account_name:
          type: string
        underlying:
          type: string
        kind:
          type: string
        strike:
          type: number
        expiry:
          type: string
          format: date
        days:
          type: integer
        contracts:
          type: number
        written:
          type: boolean
        underlying_price:
          type: number
          nullable: true
        above_strike_pct:
          type: number
          nullable: true
      type: object
      required:
      - symbol
      - account_name
      - underlying
      - kind
      - strike
      - expiry
      - days
      - contracts
      - written
    TurningLongTerm:
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date
      type: object
      required:
      - symbol
      - date
    PortalOverviewResponse:
      properties:
        as_of:
          type: string
          format: date
          nullable: true
        includes_cash:
          type: boolean
        total_value:
          type: number
          nullable: true
        cash_value:
          type: number
          nullable: true
        ytd_twr_pct:
          type: number
          nullable: true
        ytd_gain:
          type: number
          nullable: true
        ytd_realized:
          type: number
        is_provisional:
