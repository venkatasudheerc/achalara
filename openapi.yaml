      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncConfigUpdate"
      responses:
        "200":
          description: Updated sync config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetSyncConfig"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
