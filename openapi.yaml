openapi: 3.0.3
info:
  title: Portfolio Management System API
  description: |
    Multi-client, multi-strategy investment portfolio management backend.

    **Hierarchy:** Client → Account → Sleeve (Account × Strategy join) → Trades/Positions

    - A **Strategy** is a firm-wide definition (e.g. "Growth", "Income") — global and reusable.
    - A **Sleeve** is one strategy as run in one account — it owns trades, positions, and sync configs.
    - All resource IDs are UUIDs (string).
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - sessionCookie: []

tags:
  - name: root
    description: Health and service info
  - name: portal
    description: >-
      The client portal. Each route answers for the signed-in client across every account they
      may view (their own and any shared with them), narrowed by `account_id` and `strategy_id`.
      An advisor may preview a client's portal by passing `as_client`; from a client user that
      parameter is ignored. Percentages are decimal fractions. `format=csv` on positions,
      trades and realised gains returns the matching rows as a download.
  - name: auth
    description: >-
      Sign-in, one-time invite and reset links, and sharing an account with another client.
      Every route outside this tag (and the health check and the SnapTrade webhook) needs a
      session. An advisor may call anything. A client user may only read: their own client's
      roll-ups, any account they own or have been granted and everything beneath it, and benchmarks.
  - name: clients
    description: Client management and roll-up views
  - name: accounts
    description: Account management (nested under clients)
  - name: sleeves
    description: Sleeve management — trades, positions, performance
  - name: strategies
    description: Firm-wide strategy definitions
  - name: trades
    description: Individual trade creation
  - name: admin
    description: CSV import, Google Sheets sync, sync configs, and logs
  - name: performance
    description: Period performance, statistics and the account report, read from the daily valuation record
  - name: invitations
    description: A visitor's request for an invitation, and the advisor's list of them
  - name: connections
    description: Linked brokerage logins — discovery, account mapping, sync, reconciliation

paths:

  # ─── Root ───────────────────────────────────────────────────────────────────

  /:
    get:
      tags: [root]
      summary: Service info
      operationId: getRoot
      security: []
      responses:
        "200":
          description: Service name and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string

  /health:
    get:
      tags: [root]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  environment:
                    type: string

  # ─── Sign-in ────────────────────────────────────────────────────────────────

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      operationId: login
      description: >-
        Sets the session as an http-only cookie. An unknown email and a wrong password get the
        same answer. After 5 failed attempts sign-in pauses for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Email and password don't match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      operationId: logout
      security: []
      responses:
        "204":
          description: Session ended and the cookie cleared

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      operationId: getMe
      description: >-
        For a client user, also the accounts they may view: their own, and any shared with them.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change your own password
      operationId: changePassword
      description: >-
        Every other session of the user is ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; a fresh session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not signed in, or the current password is wrong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The new password does not meet the rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/users:
    get:
      tags: [auth]
      summary: List logins (advisor only)
      operationId: listUsers
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/invites:
    post:
      tags: [auth]
      summary: Invite a client to set up their login (advisor only)
      operationId: inviteClient
      description: >-
        Creates the client's login if needed and returns a one-time link, valid for 7 days. The token
        is shown only in this response. A new invite replaces an earlier unused one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: The link to pass on to the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeLink"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The client already has a login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/link-emails:
    post:
      tags: [auth]
      summary: Email a one-time link to the client it was made for (advisor only)
      operationId: emailLink
      description: >-
        Sends an unused invite or reset link to the login's own sign-in email, never to an address
        given with the request. The message carries the link and nothing about the client's accounts.
        The link is unaffected and can still be passed on by hand.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLinkRequest"
      responses:
        "200":
          description: Whether the message was accepted, and where it went
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailLinkResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The link is unknown, used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/users/{user_id}/password-reset:
    post:
      tags: [auth]
      summary: Create a password-reset link for a user (advisor only)
      operationId: createPasswordReset
      description: >-
        A one-time link, valid for 24 hours.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The link to pass on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeLink"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/users/{user_id}/email:
    patch:
      tags: [auth]
      summary: Change the email a client signs in with (advisor only)
      operationId: changeSignInEmail
      description: >-
        The old address stops working at once and the client is signed out everywhere. A password
        already set is kept. Returns a one-time link to send them: a password reset, or a fresh
        invite if they never set a password. Does not change the client's contact email.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "200":
          description: Email changed; the link to pass on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeLink"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another login already uses that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Not a valid email, or the user is not a client login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/links/{token}:
    get:
      tags: [auth]
      summary: Who an invite or reset link is for
      operationId: previewLink
      description: >-
        Shown before a password is chosen. Unknown, used and expired links all answer 404.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The link is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPreview"
        "404":
          description: The link is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/links/{token}/accept:
    post:
      tags: [auth]
      summary: Set the password a link was issued for, and sign in
      operationId: acceptLink
      description: >-
        The link works once. Any earlier sessions of the user are ended.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "200":
          description: Password set; the session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "404":
          description: The link is not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The password does not meet the rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/clients/{client_id}/account-access:
    get:
      tags: [auth]
      summary: Other clients' accounts this client may view (advisor only)
      operationId: listAccountAccess
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountAccessResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [auth]
      summary: Let this client view an account owned by another client (advisor only)
      operationId: grantAccountAccess
      description: >-
        Read-only access to that one account and everything beneath it.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAccessRequest"
      responses:
        "201":
          description: Access granted (or already in place)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAccessResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Client or account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The client already owns the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/clients/{client_id}/account-access/{account_id}:
    delete:
      tags: [auth]
      summary: Withdraw a client's access to a shared account (advisor only)
      operationId: revokeAccountAccess
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Access removed
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed in, but not allowed (advisor only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Clients ────────────────────────────────────────────────────────────────

  /api/v1/clients/:
    get:
      tags: [clients]
      summary: List all clients
      operationId: listClients
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientResponse"
    post:
      tags: [clients]
      summary: Create a client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientCreate"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/clients/{client_id}:
    get:
      tags: [clients]
      summary: Get a client by ID
      operationId: getClient
      parameters:
        - $ref: "#/components/parameters/client_id"
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [clients]
      summary: Correct a client's name or contact email (advisor only)
      description: >-
        A field left out is kept. A new name is carried to the client's login, where the portal reads
        it. The email a client signs in with belongs to their login and is not changed here.
      operationId: updateClient
      parameters:
        - $ref: "#/components/parameters/client_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: The client as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientResponse"
        "400":
          description: Another client already has that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: A blank name or an address that is not an email

  /api/v1/clients/{client_id}/performance:
    get:
      tags: [clients]
      summary: Client-level performance roll-up (MWR/TWR)
      description: Merges all trade flows across every sleeve under this client. Returns per-account children.
      operationId: getClientPerformance
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/start_date"
        - $ref: "#/components/parameters/end_date"
      responses:
        "200":
          description: Client performance with account-level children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelPerformance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/performance/monthly:
    get:
      tags: [clients]
      summary: Client month-on-month returns since inception
      operationId: getClientMonthlyPerformance
      parameters:
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [market, realized]
            default: market
          description: |
            How holdings are valued. `market`: at each day's prices. `realized`:
            at cost, so a gain counts only on the day its position is closed and
            unrealised gains are left out of values and returns.
        - $ref: "#/components/parameters/client_id"
      responses:
        "200":
          description: Monthly return breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReturnsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/performance/returns-series:
    get:
      tags: [clients]
      summary: Weekly TWR + MWR timeseries for a client
      operationId: getClientReturnsSeries
      parameters:
        - name: basis
          in: query
          required: false
          schema:
            type: string
            enum: [market, realized]
            default: market
          description: |
            How holdings are valued. `market`: at each day's prices. `realized`:
            at cost, so a gain counts only on the day its position is closed and
            unrealised gains are left out of values and returns.
        - $ref: "#/components/parameters/client_id"
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Weekly returns series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnsSeriesResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/positions:
    get:
      tags: [clients]
      summary: Merged positions across all sleeves for a client
      operationId: getClientPositions
      parameters:
        - $ref: "#/components/parameters/client_id"
      responses:
        "200":
          description: Aggregated position summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPositionsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/trades:
    get:
      tags: [clients]
      summary: All trades across all sleeves for a client
      operationId: getClientTrades
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/skip"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Paginated trade list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientTradesResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Accounts ───────────────────────────────────────────────────────────────

  /api/v1/clients/{client_id}/accounts:
    post:
      tags: [accounts]
      summary: Create an account for a client
      operationId: createAccount
      parameters:
        - $ref: "#/components/parameters/client_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [accounts]
      summary: List the accounts a client owns and those shared with them
      description: >-
        The client's own accounts first, then accounts of other clients they have been allowed to
        view, marked `shared`. Totals and performance for a client still cover only the accounts
        they own.
      operationId: listAccounts
      parameters:
        - $ref: "#/components/parameters/client_id"
        - name: include_shared
          in: query
          schema:
            type: boolean
            default: true
          description: False lists only the accounts the client owns.
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/accounts/{account_id}:
    get:
      tags: [accounts]
      summary: Get a specific account
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/account_id"
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [accounts]
      summary: Set the account's cost basis method
      description: >-
        Which lots a sale closes first, as set at the brokerage. Realised gains and open
        cost are re-read under the new method. Advisor only.
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/account_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: The account as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/accounts/{account_id}/performance:
    get:
      tags: [accounts]
      summary: Account-level performance roll-up (MWR/TWR)
      description: Merges all trade flows across every sleeve in this account. Returns per-sleeve children.
      operationId: getAccountPerformance
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/start_date"
        - $ref: "#/components/parameters/end_date"
      responses:
        "200":
          description: Account performance with sleeve-level children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelPerformance"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/accounts/{account_id}/performance/monthly:
    get:
      tags: [accounts]
      summary: Account month-on-month returns since inception
