  # ─── Brokerage connections ──────────────────────────────────────────────────

  /api/v1/clients/{client_id}/connections/snaptrade/link:
    post:
      tags: [connections]
      summary: Start linking a brokerage login
      description: |
        Returns a hosted SnapTrade portal URL where the client signs in to their
        brokerage. **The URL expires in about five minutes** — open it immediately.
        There is no callback; after the portal is finished, call `discover`.
        Read-only access is requested.
      operationId: startBrokerageLink
      parameters:
        - $ref: "#/components/parameters/client_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: SnapTrade is not configured on the server

  /api/v1/clients/{client_id}/connections/discover:
    post:
      tags: [connections]
      summary: Record the logins and accounts the brokerage source reports
      description: |
        Run after the linking portal completes. Safe to repeat: existing rows are
        updated, account mappings are untouched, and a login the source no longer
        lists is marked deleted.
      operationId: discoverConnections
      parameters:
        - $ref: "#/components/parameters/client_id"
      responses:
        "200":
          description: The client's connections after discovery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: SnapTrade is not configured on the server

  /api/v1/clients/{client_id}/connections:
    get:
      tags: [connections]
      summary: List a client's brokerage connections and their accounts
      operationId: listConnections
      parameters:
        - $ref: "#/components/parameters/client_id"
      responses:
        "200":
          description: Connections (removed ones are omitted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /api/v1/connections/{connection_id}:
    delete:
      tags: [connections]
      summary: Revoke a brokerage login
      description: Revokes access at the source. Trades already ingested are kept.
      operationId: removeConnection
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/brokerage-accounts/{brokerage_account_id}:
    patch:
      tags: [connections]
      summary: Map a discovered account into the hierarchy, or ignore it
      description: |
        `mapped` creates an Achalara account (unless `account_id` names one) and
        a FIFO sleeve for `strategy_id` (default: the "Unallocated" strategy).
        The account may belong to a different client than the login: pass
        `client_id` to name its owner.
        The sleeve must not already hold trades. An account cannot be remapped
        once it has synced.
      operationId: updateBrokerageAccount
      parameters:
        - $ref: "#/components/parameters/brokerage_account_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrokerageAccountUpdate"
      responses:
        "200":
          description: Updated brokerage account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerageAccount"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Mapping not allowed (sleeve holds trades, or already synced)

  /api/v1/brokerage-accounts/{brokerage_account_id}/sync:
    post:
      tags: [connections]
      summary: Pull new trades and cash activity for a mapped account
      description: |
        At most once per 24 hours per account (the source's limit); an earlier
        call returns `status: skipped`, `reason: synced_recently`. Also skipped
        while the source is still loading history (`initial_sync_pending`) or
        rate limiting (`rate_limited`). Brokerage transactions are a daily batch
        and lag holdings by days — see `transactions_synced_through`.
      operationId: syncBrokerageAccount
      parameters:
        - $ref: "#/components/parameters/brokerage_account_id"
        - name: full_history
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Reload from the account's first day instead of from the last watermark
      responses:
        "200":
          description: Sync outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerageSyncResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account is not mapped, or its connection is broken
        "502":
          description: The brokerage source failed

  /api/v1/brokerage-accounts/{brokerage_account_id}/reconciliation:
    get:
      tags: [connections]
      summary: Brokerage holdings compared with positions derived from trades
      operationId: getReconciliation
      parameters:
        - $ref: "#/components/parameters/brokerage_account_id"
      responses:
        "200":
          description: Result of the last reconciliation (empty before the first sync)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reconciliation"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clients/{client_id}/accounts/{account_id}/sleeves/{sleeve_id}/cash-activities:
    get:
      tags: [sleeves]
      summary: Dividends, fees and other non-trade money movements for a sleeve
      operationId: getSleeveCashActivities
      parameters:
        - $ref: "#/components/parameters/client_id"
        - $ref: "#/components/parameters/account_id"
        - $ref: "#/components/parameters/sleeve_id"
      responses:
        "200":
          description: Cash activities, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashActivity"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/trades/reassign:
    post:
      tags: [trades]
      summary: Move a symbol's whole history to another sleeve of the same account
      description: |
        Moves every trade and cash activity for the named symbols. The unit is
        the symbol, not the trade, so buys and their sells stay together.
        Positions and snapshots are recomputed for both sleeves.
      operationId: reassignTrades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignRequest"
      responses:
        "200":
          description: What was moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sleeves are in different accounts, or use different lot matching

  /api/v1/invitation-requests:
    post:
      tags: [invitations]
      summary: Leave a request for an invitation (public)
      operationId: requestInvitation
      security: []
      description: |
        The form on the public page. Open to anyone, so it guards itself: a limit
        on how often one sender may ask and on how many requests a day are kept,
        a hidden field (`website`) that only a script fills in, and no second row
        for an email whose request is still waiting. The answer is the same
        whatever became of the request. Where email is set up, the only thing ever
        sent to the email given is one message with a link to confirm the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRequestCreate"
      responses:
        "202":
          description: Received
          content:
            application/json:
              schema:
                type: object
                required: [received, confirm_by_email]
                properties:
                  received:
                    type: boolean
                  confirm_by_email:
                    type: boolean
                    description: >-
                      Whether the visitor should look for an email to confirm the request. The same for
                      every request on a server (true when email is set up), so it says nothing about
                      this one.
        "422":
          description: >-
            A field is missing or does not pass: a name of letters, an email whose domain receives
            mail, a phone number of 10 to 15 digits that is not one digit repeated or a plain run, and
            comments of at least 50 characters made of words

  /api/v1/invitation-requests/confirm:
    post:
      tags: [invitations]
      summary: Confirm a request with the link emailed to the visitor (public)
      operationId: confirmInvitationRequest
      security: []
      description: >-
        Where email is set up, a request is shown to the advisor and alerted only once the visitor
        follows the link emailed to them, proving the address is theirs. Called when the visitor
        presses the button on the page the link opens, so a mail scanner fetching the link cannot
        confirm it. The link works once and expires after 48 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                required: [confirmed]
                properties:
                  confirmed:
                    type: boolean
        "404":
          description: The link is unknown, already used or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/invitation-requests:
    get:
      tags: [invitations]
      summary: Requests for an invitation, those still waiting first (advisor only)
      operationId: listInvitationRequests
      responses:
        "200":
          description: Every request on file
          content:
            application/json:
              schema:
