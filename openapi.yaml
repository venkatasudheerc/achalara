  /api/v1/admin/invitation-requests/{request_id}:
    patch:
      tags: [invitations]
      summary: Mark a request as contacted or dismissed, or put it back as new (advisor only)
      operationId: updateInvitationRequest
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
