      operationId: getClientPeriods
      parameters:
        - $ref: "#/components/parameters/client_id"
        - name: grain
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, quarter, year]
            default: month
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: benchmark
          in: query
          required: false
          schema:
            type: string
