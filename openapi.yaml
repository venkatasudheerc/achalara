  /api/v1/portal/links/plaid/{connection_id}/repair:
    post:
      tags: [portal]
      summary: Sign in again to a Plaid login
      description: A token that opens Plaid Link in update mode for one of the viewer's own logins. No new place on the plan is used, and the login's history carries on. With select_accounts, Link also lets the client share accounts the institution does not share yet.
      operationId: repairPlaidLogin
      parameters:
        - {name: connection_id, in: path, required: true, schema: {type: string}}
        - {name: select_accounts, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: as_client, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The token for Plaid Link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaidLinkStart'}
        '404': {description: Not one of the viewer's logins}
  /api/v1/portal/links/plaid/discover:
    post:
      tags: [portal]
      summary: Check my logins for new accounts
      description: Asks Plaid what each of the viewer's own logins shares now and keeps a row for each account not seen before, left for the client to choose. Accounts already known, mapped or not, are never touched. A login that needs signing in again is counted, not read.
      operationId: plaidDiscoverMine
      parameters:
        - {name: as_client, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: How many logins were checked and how many new accounts wait
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaidDiscovered'}
  /api/v1/portal/links/plaid/{connection_id}/discover:
    post:
      tags: [portal]
      summary: Check one login for new accounts
      description: The same check for one of the viewer's own logins, answering with its accounts and what is proposed for each, as the link flow does.
      operationId: plaidDiscoverLogin
      parameters:
        - {name: connection_id, in: path, required: true, schema: {type: string}}
        - {name: as_client, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The login's accounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaidFound'}
        '404': {description: Not one of the viewer's logins}
        '409': {description: The login needs signing in again first}
        '502': {description: Plaid could not answer}
        '503': {description: The saved sign-in cannot be opened on this server}
  /api/v1/portal/links/plaid/refresh:
    post:
      tags: [portal]
      summary: Refresh my linked accounts now
      description: The morning refresh now, for the viewer's own Plaid logins only (never a spouse's or a shared one). A login checked in the last ten minutes, or one that needs signing in again, is left as it is.
      operationId: plaidRefreshMine
      parameters:
