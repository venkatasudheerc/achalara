  /api/v1/trades/reassign:
    post:
      tags: [trades]
      summary: Move a symbol's whole history to another sleeve of the same account
      description: |
        Moves every trade and cash activity for the named symbols. The unit is
        the symbol, not the trade, so buys and their sells stay together.
        Positions and snapshots are recomputed for both sleeves.
      operationId: reassignTrades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignRequest"
      responses:
        "200":
          description: What was moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReassignResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Sleeves are in different accounts, or use different lot matching

  /api/v1/webhooks/snaptrade:
    post:
      tags: [connections]
      summary: SnapTrade webhook receiver
      security: []
      description: |
        Verifies the `Signature` header (HMAC-SHA256 of the raw body, keyed with
        the consumer key) before the body is parsed. Called by SnapTrade, not by
        the frontend.
      operationId: snaptradeWebhook
      parameters:
        - name: Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          description: Missing or invalid signature

