# Achalara in production, on one server: the database, the backend and the web
# front (the built app plus HTTPS), each in its own container.
#
#   cd /srv/achalara/deploy && docker compose up -d --build
#
# Settings come from deploy/.env on the server (see .env.example). That file
# holds the secrets and is never committed.

name: achalara

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-achalara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-achalara}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No published port: only the backend, on the private network, reaches it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ../backend
    restart: unless-stopped
    # Exactly one: the daily jobs run inside this process.
    deploy:
      replicas: 1
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-achalara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-achalara}
      PYTHON_ENV: production
      SCHEDULER_ENABLED: "true"
      CORS_ALLOW_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env}
      STATUS_DIR: /status
    volumes:
      # Where the server's backup script reports its result, for the status page.
      - ${STATUS_DIR:-/srv/achalara-status}:/status:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # The HTTPS certificates; losing these only means they are issued again.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:
